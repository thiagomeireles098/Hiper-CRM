name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            GIT_DIR="$(find /opt/hiperlink -maxdepth 4 -type d -name .git -print -quit)"
            if [ -z "$GIT_DIR" ]; then
              echo "No git checkout found under /opt/hiperlink"
              exit 1
            fi

            APP_DIR="$(dirname "$GIT_DIR")"
            cd "$APP_DIR"

            git fetch origin main
            git reset --hard origin/main

            rm -f docker-compose.override.yml docker-compose.prod.yml Caddyfile

            export GETFY_CADDY_HOST=app.hiperlinksolutions.com.br
            export GETFY_APP_URL=https://app.hiperlinksolutions.com.br
            export GETFY_APP_ENV=production
            export GETFY_APP_DEBUG=false
            export GETFY_HTTP_PORT=80
            export GETFY_HTTPS_PORT=443

            docker compose -p hiperlink -f docker-compose.caddy.yml down --remove-orphans || true
            if ! docker compose -p hiperlink -f docker-compose.caddy.yml up -d --build --remove-orphans; then
              docker compose -p hiperlink -f docker-compose.caddy.yml ps || true
              docker compose -p hiperlink -f docker-compose.caddy.yml logs --tail=200 app queue mysql caddy || true
              exit 1
            fi
            docker compose -p hiperlink -f docker-compose.caddy.yml ps || true
            docker compose -p hiperlink -f docker-compose.caddy.yml logs --tail=120 caddy || true
            ss -ltnp | grep -E ':(80|443)\s' || true
            curl -I --max-time 15 http://127.0.0.1/login || true
            curl -kI --max-time 20 https://127.0.0.1/login || true
