services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hiperlink
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    image: hiperlink/api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/hiperlink?schema=public
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: "true"
      APP_URL: https://${APP_DOMAIN}
    volumes:
      - uploads:/app/uploads
    depends_on: [postgres, redis]

  web:
    image: hiperlink/web:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    depends_on: [api]

volumes:
  pg_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config: